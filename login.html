<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطولة رقي | دخول الإدارة</title>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;...
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
    font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#0b1f1e;color:#eafffd}
  .card{width:100%;max-width:400px;background:#12302e;border:1px solid #1f5a56;
    border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:26px}
  .sub{margin:0;opacity:.7}
  .badge{padding:10px 12px;border-radius:12px;background:#0b1f1e;font-size:14px}
  .badge.ok{border:1px solid #1fb8ad}
  .badge.bad{border:1px solid #d94a4a;color:#ffb4b4}
  label{display:flex;flex-direction:column;gap:6px;font-size:14px}
  input{font:inherit;padding:12px;border-radius:12px;border:1px solid #1f5a56;
    background:#0b1f1e;color:inherit}
  button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;
    background:#12b8b0;color:#04201f;cursor:pointer}
  button.ghost{background:transparent;color:inherit;border:1px solid #1f5a56}
  button:disabled{opacity:.5}
  form,#panel{display:flex;flex-direction:column;gap:12px}
  .msg{min-height:20px;margin:0;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>بطولة رقي</h1>
  <p class="sub">دخول الإدارة</p>

  <div id="conn" class="badge">جارٍ فحص الاتصال...</div>

  <form id="loginForm">
    <label>البريد الإلكتروني
      <input type="email" id="email" required autocomplete="email">
    </label>
    <label>كلمة السر
      <input type="password" id="password" required autocomplete="current-password">
    </label>
    <button type="submit" id="loginBtn">دخول</button>
  </form>

  <div id="panel" hidden>
    <div id="who" class="badge ok"></div>
    <button type="button" id="testWriteBtn">اختبار صلاحية الكتابة</button>
    <button type="button" id="logoutBtn" class="ghost">تسجيل الخروج</button>
  </div>

  <p id="msg" class="msg"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dymdsrzahlsnxbaefano.supabase.co";
const SUPABASE_KEY = "sb_publishable_1M188MN2wyKEWFo8h6uXMg_NcVEY6k5";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

function say(text, bad) {
  $("msg").textContent = text;
  $("msg").style.color = bad ? "#ffb4b4" : "#8ff0e8";
}

/* 1) فحص الاتصال بالقاعدة (القراءة مفتوحة للجميع) */
async function checkConnection() {
  const { count, error } = await db
    .from("teams")
    .select("*", { count: "exact", head: true });

  if (error) {
    $("conn").className = "badge bad";
    $("conn").textContent = "فشل الاتصال: " + error.message;
    return;
  }
  $("conn").className = "badge ok";
  $("conn").textContent = "الاتصال بالقاعدة ناجح ✅ (عدد الفرق: " + count + ")";
}

/* 2) عرض حالة تسجيل الدخول */
function showUser(user) {
  const loggedIn = !!user;
  $("loginForm").hidden = loggedIn;
  $("panel").hidden = !loggedIn;
  if (loggedIn) $("who").textContent = "مسجَّل الدخول: " + user.email;
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginBtn").disabled = true;
  say("جارٍ تسجيل الدخول...");

  const { data, error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  $("loginBtn").disabled = false;

  if (error) {
    say("تعذر الدخول: البريد أو كلمة السر غير صحيحة", true);
    return;
  }
  $("password").value = "";
  say("تم تسجيل الدخول ✅");
  showUser(data.user);
});

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  showUser(null);
  say("تم تسجيل الخروج");
});

/* 3) اختبار الكتابة: يضيف فريقًا مؤقتًا ثم يحذفه فورًا */
$("testWriteBtn").addEventListener("click", async () => {
  say("جارٍ الاختبار...");
  const { data, error } = await db
    .from("teams")
    .insert({ name: "__اختبار__", grp: "A" })
    .select()
    .single();

  if (error) {
    say("الكتابة مرفوضة: " + error.message, true);
    return;
  }
  await db.from("teams").delete().eq("id", data.id);
  say("الكتابة مسموحة ✅ (أُضيف سجل تجريبي وحُذف)");
});

/* التشغيل */
checkConnection();
db.auth.getSession().then(({ data }) => showUser(data.session?.user || null));
</script>
</body>
</html>
