<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة بطولة رقي</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div><b>لوحة إدارة بطولة رقي</b><small id="who"></small></div>
  <button class="ghost sm" id="logoutBtn">خروج</button>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="teams">الفرق</button>
    <button class="tab" data-tab="players">اللاعبون</button>
  </div>

  <section id="tab-teams" class="stack">
    <div class="card">
      <h2>إضافة فرق</h2>
      <label>المجموعة
        <select id="teamGroup">
          <option value="A">المجموعة A</option>
          <option value="B">المجموعة B</option>
        </select>
      </label>
      <label>أسماء الفرق (اسم في كل سطر)
        <textarea id="teamNames" placeholder="فريق 1&#10;فريق 2"></textarea>
      </label>
      <button id="addTeamsBtn">إضافة</button>
    </div>
    <div class="card"><h2>المجموعة A</h2><div id="listA"></div></div>
    <div class="card"><h2>المجموعة B</h2><div id="listB"></div></div>
  </section>

  <section id="tab-players" class="stack" hidden>
    <div class="card">
      <h2>إضافة لاعبين</h2>
      <label>الفريق<select id="playerTeam"></select></label>
      <label>المركز<select id="playerPos"></select></label>
      <label>أسماء اللاعبين (اسم في كل سطر)
        <textarea id="playerNames"></textarea>
      </label>
      <button id="addPlayersBtn">إضافة</button>
    </div>
    <div class="card">
      <h2>قائمة اللاعبين</h2>
      <label>عرض لاعبي<select id="playerFilter"></select></label>
      <div id="playersList"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const POSITIONS = ["حارس مرمى", "مدافع", "وسط", "مهاجم"];
let teams = [];
let players = [];

const lines = (v) => v.split("\n").map((s) => s.trim()).filter(Boolean);

function keepValue(select, html) {
  const current = select.value;
  select.innerHTML = html;
  if ([...select.options].some((o) => o.value === current)) select.value = current;
}

async function load() {
  const [t, p] = await Promise.all([
    db.from("teams").select("*").order("created_at"),
    db.from("players").select("*").order("created_at")
  ]);
  const err = t.error || p.error;
  if (err) return toast(friendlyError(err), true);
  teams = t.data;
  players = p.data;
  render();
}

function teamRow(t) {
  const n = players.filter((p) => p.team_id === t.id).length;
  return `<div class="row">
    <div><b>${esc(t.name)}</b><small>${n} لاعب</small></div>
    <div class="acts">
      <button class="ghost sm" data-act="team-rename" data-id="${t.id}">تعديل</button>
      <button class="ghost sm danger" data-act="team-del" data-id="${t.id}">حذف</button>
    </div>
  </div>`;
}

function render() {
  for (const g of ["A", "B"]) {
    const list = teams.filter((t) => t.grp === g);
    $("list" + g).innerHTML = list.length
      ? list.map(teamRow).join("")
      : `<p class="empty">لا توجد فرق بعد</p>`;
  }

  const opts = teams
    .map((t) => `<option value="${t.id}">${esc(t.name)} (${t.grp})</option>`)
    .join("");
  keepValue($("playerTeam"), opts || `<option value="">أضف فريقًا أولًا</option>`);
  keepValue($("playerFilter"), `<option value="all">كل الفرق</option>` + opts);
  renderPlayers();
}

function renderPlayers() {
  const f = $("playerFilter").value;
  const list = players.filter((p) => f === "all" || p.team_id === f);
  $("playersList").innerHTML = list.length
    ? list.map((p) => {
        const t = teams.find((x) => x.id === p.team_id);
        return `<div class="row">
          <div><b>${esc(p.name)}</b>
          <small>${esc(t ? t.name : "—")}${p.position ? " · " + esc(p.position) : ""}</small></div>
          <div class="acts">
            <button class="ghost sm" data-act="player-rename" data-id="${p.id}">تعديل</button>
            <button class="ghost sm danger" data-act="player-del" data-id="${p.id}">حذف</button>
          </div>
        </div>`;
      }).join("")
    : `<p class="empty">لا يوجد لاعبون</p>`;
}

async function run(promise, okMessage) {
  const { error } = await promise;
  if (error) return toast(friendlyError(error), true);
  toast(okMessage);
  await load();
}

/* الإضافة */
$("addTeamsBtn").onclick = async () => {
  const names = lines($("teamNames").value);
  if (!names.length) return toast("اكتب اسم فريق واحد على الأقل", true);
  const grp = $("teamGroup").value;
  const { error } = await db.from("teams").insert(names.map((name) => ({ name, grp })));
  if (error) return toast(friendlyError(error), true);
  $("teamNames").value = "";
  toast("تمت إضافة " + names.length + " فريق");
  await load();
};

$("addPlayersBtn").onclick = async () => {
  const team_id = $("playerTeam").value;
  const names = lines($("playerNames").value);
  if (!team_id) return toast("أضف فريقًا أولًا", true);
  if (!names.length) return toast("اكتب اسم لاعب واحد على الأقل", true);
  const position = $("playerPos").value || null;
  const { error } = await db
    .from("players")
    .insert(names.map((name) => ({ name, team_id, position })));
  if (error) return toast(friendlyError(error), true);
  $("playerNames").value = "";
  toast("تمت إضافة " + names.length + " لاعب");
  await load();
};

/* التعديل والحذف */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = b.dataset.id;

  if (b.dataset.act === "team-rename") {
    const t = teams.find((x) => x.id === id);
    const n = prompt("اسم الفريق الجديد", t.name);
    if (n && n.trim()) run(db.from("teams").update({ name: n.trim() }).eq("id", id), "تم التعديل");
  }
  if (b.dataset.act === "team-del") {
    if (confirm("حذف هذا الفريق؟")) run(db.from("teams").delete().eq("id", id), "تم الحذف");
  }
  if (b.dataset.act === "player-rename") {
    const p = players.find((x) => x.id === id);
    const n = prompt("اسم اللاعب الجديد", p.name);
    if (n && n.trim()) run(db.from("players").update({ name: n.trim() }).eq("id", id), "تم التعديل");
  }
  if (b.dataset.act === "player-del") {
    if (confirm("حذف هذا اللاعب؟")) run(db.from("players").delete().eq("id", id), "تم الحذف");
  }
});

/* التبويبات */
document.querySelectorAll(".tab").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === b));
    $("tab-teams").hidden = b.dataset.tab !== "teams";
    $("tab-players").hidden = b.dataset.tab !== "players";
  };
});

$("playerFilter").onchange = renderPlayers;
$("logoutBtn").onclick = logout;

/* التشغيل */
(async () => {
  const user = await requireLogin();
  if (!user) return;
  $("who").textContent = user.email;
  $("playerPos").innerHTML =
    `<option value="">غير محدد</option>` +
    POSITIONS.map((p) => `<option>${p}</option>`).join("");
  await load();
})();
</script>
</body>
</html>
